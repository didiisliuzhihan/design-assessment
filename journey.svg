<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Evidence review with a normal path and an exception loop</title><desc id="desc">Locate documents and compare originals against the authorized client request. Complete, consistent evidence proceeds to authorized bind review. Missing, conflicting or uncertain evidence enters a human-approved request and returns for renewed review. A reply alone does not resolve an issue.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4d7a7b"/></marker></defs><rect width="1200" height="400" fill="white"/><g font-family="system-ui,sans-serif"><text x="20" y="30" font-size="13" font-weight="700" fill="#166653">USER JOURNEY · ASSISTANT CHECKS EVIDENCE; AUTHORIZED PERSON DECIDES BINDING</text><g fill="#f0f6f4" stroke="#bdd3cb"><rect x="20" y="85" width="300" height="110" rx="7"/><rect x="370" y="85" width="340" height="110" rx="7"/><rect x="890" y="85" width="280" height="110" rx="7"/><rect x="370" y="255" width="340" height="105" rx="7"/></g><g fill="#1c3038" font-size="17" font-weight="650"><text x="38" y="115">1. Documents</text><text x="388" y="115">2. Review checklist</text><text x="908" y="115">Authorized bind review</text><text x="388" y="285">3. Follow-up</text></g><g fill="#526a70" font-size="12"><text x="38" y="141">Portal · email · fax source inventory</text><text x="38" y="165">Human checks uncertain source matches</text><text x="388" y="141">Certificate + application + authorized request</text><text x="388" y="165">Human verifies originals and raises concerns</text><text x="908" y="141">Required checks satisfied?</text><text x="908" y="165">Prepare reviewed versions for handoff.</text><text x="388" y="310">Reviewed gaps → editable structured email</text><text x="388" y="334">Human approves message; owner follows up</text></g><g fill="none" stroke="#4d7a7b" stroke-width="2" marker-end="url(#arrow)"><path d="M320 140H358"/><path d="M710 140H878"/><path d="M460 195V243"/><path d="M630 255V207"/></g><g font-size="11" fill="#526a70"><text x="735" y="117">Complete + consistent</text><text x="20" y="228">Missing / conflicting / uncertain →</text><text x="654" y="229">New evidence → recheck</text></g><rect x="890" y="255" width="280" height="105" fill="#fff2e8" stroke="#e5ccb3" rx="5"/><g fill="#8b5316" font-size="12"><text x="908" y="283" font-weight="700">BINDING REMAINS BLOCKED</text><text x="908" y="307">Required evidence missing or unresolved.</text><text x="908" y="331">Reply received ≠ issue resolved.</text></g><text x="20" y="389" fill="#526a70" font-size="11">AI suggests and drafts. People inspect, request clarification and authorize. Prototype handoff does not activate a policy.</text></g></svg>
