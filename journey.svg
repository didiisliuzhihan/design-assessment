<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">From scattered documents to an authorized bind review</title><desc id="desc">Locate sources, compare coverage and the client request, resolve exceptions through a human-approved request, review incoming corrections, then prepare the authorized bind review. Missing requirements and unresolved limits block advancement.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4d7a7b"/></marker></defs><rect width="1200" height="300" fill="white"/><g font-family="system-ui,sans-serif"><text x="20" y="30" font-size="13" font-weight="700" fill="#166653">USER JOURNEY · ASSISTANT PREPARES, AUTHORIZED PERSON BINDS</text><g fill="#f0f6f4" stroke="#bdd3cb"><rect x="20" y="65" width="240" height="100" rx="7"/><rect x="320" y="65" width="240" height="100" rx="7"/><rect x="620" y="65" width="240" height="100" rx="7"/><rect x="920" y="65" width="260" height="100" rx="7"/></g><g fill="#1c3038" font-size="17" font-weight="650"><text x="38" y="95">1. Locate and link</text><text x="338" y="95">2. Compare originals</text><text x="638" y="95">3. Resolve the exception</text><text x="938" y="95">Authorized bind review</text></g><g fill="#526a70" font-size="12"><text x="38" y="119">Portal · email · fax source inventory</text><text x="38" y="141">Human confirms uncertain matches</text><text x="338" y="119">Certificate + application + client request</text><text x="338" y="141">Human verifies values and request</text><text x="638" y="119">Human approves outgoing request</text><text x="638" y="141">Owner + reply + next action visible</text><text x="938" y="119">Required evidence reviewed?</text><text x="938" y="141">Limits resolved? Then hand off.</text></g><g fill="none" stroke="#4d7a7b" stroke-width="2" marker-end="url(#arrow)"><path d="M260 115H308"/><path d="M560 115H608"/><path d="M860 115H908"/><path d="M740 165V214H440V176"/></g><text x="330" y="237" font-size="12" fill="#526a70">Corrected document received → reopen comparison; a reply is not resolution.</text><rect x="920" y="188" width="260" height="65" fill="#fff2e8" stroke="#e5ccb3" rx="5"/><g fill="#8b5316" font-size="12"><text x="937" y="212" font-weight="700">HARD STOP</text><text x="937" y="234">Missing required docs or unresolved limits</text></g><text x="20" y="281" fill="#526a70" font-size="11">AI retrieves, suggests, compares and drafts. People verify the evidence, approve messages and authorize binding. No automatic activation.</text></g></svg>
